<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#13a74f">
  <title>GaGa Chat for Android</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5faf6; color: #183b27; }
    main { max-width: 480px; padding: 32px 24px; text-align: center; }
    .mark { width: 112px; height: 112px; margin: 0 auto 24px; display: grid; place-items: center;
      border-radius: 30px; background: linear-gradient(145deg,#7ce964,#13a74f); color: white;
      box-shadow: 0 12px 32px #167d3b36; font-size: 28px; font-weight: 800; }
    h1 { margin: 0 0 12px; font-size: 36px; }
    p { line-height: 1.55; color: #466654; }
    .badge { display: inline-block; margin-top: 12px; border-radius: 100px; padding: 10px 16px;
      background: #dff7e4; color: #146736; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">GaGa</div>
    <h1>GaGa Chat</h1>
    <p>Messaging, groups, and audio and video calls for Android.</p>
    <p class="badge">Android testing in progress</p>
  </main>
</body>
</html>
