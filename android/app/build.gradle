apply plugin: 'com.android.application'

android {
    namespace "gagachat.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "gagachat.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Release signing. Credentials are read from android/keystore.properties
    // (git-ignored) so no secrets are committed to the repository.
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // Sign with every scheme so the APK verifies on the widest range
                // of Android versions: v1 (JAR) for Android 5-6, v2 for Android
                // 7+, v3 for Android 9+. v1+v2 already cover all versions; v3 is
                // added for completeness and future-proofing.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            // PERFORMANCE: R8 code shrinking + obfuscation + resource shrinking.
            // This removes unused code/resources, shrinks classes.dex, and speeds
            // up cold start (fewer classes to load) and install (smaller APK).
            // The keep rules in proguard-rules.pro protect Capacitor plugins,
            // the WebView JS bridge and Firebase, which are reached reflectively.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


// A release without the existing keystore is not a distributable update.
tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.doFirst {
            def propsFile = rootProject.file("keystore.properties")
            if (!propsFile.isFile()) {
                throw new GradleException("Release signing is missing. Restore the existing keystore; do not generate a replacement key.")
            }
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
                if (!props.getProperty(key)?.trim()) {
                    throw new GradleException("Missing release signing property: " + key)
                }
            }
            if (!file(props.getProperty("storeFile")).isFile()) {
                throw new GradleException("Configured release keystore does not exist.")
            }
        }
    }
}
