<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#00C300" />
<title>Open in GaGa Chat</title>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:#f6f8fa; color:#0f172a; display:flex; min-height:100vh; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .box { background:#fff; border-radius:18px; padding:32px 24px; max-width:420px; box-shadow:0 8px 28px rgba(15,23,42,.08); }
  .logo { width:72px; height:72px; border-radius:18px; background:#00C300; color:#fff; font-size:36px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; margin-bottom:16px; }
  h1 { font-size:1.3rem; margin:0 0 8px; }
  p { color:#5b6577; margin:0 0 22px; }
  a.btn { display:inline-block; background:#00C300; color:#fff; font-weight:700; padding:13px 26px; border-radius:999px; text-decoration:none; }
  a.link { display:block; margin-top:16px; color:#00a000; font-size:.9rem; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">G</div>
    <h1>Open in GaGa Chat</h1>
    <p>This link opens inside the GaGa Chat app. If nothing happens, install the app to continue.</p>
    <a class="btn" id="open" href="#">Open the app</a>
    <a class="link" href="/download">Don't have GaGa Chat? Download it</a>
  </div>
  <script>
    (function () {
      var path = location.pathname.replace(/^\//, '');
      var target = 'gagachat://' + path + location.search;
      document.getElementById('open').setAttribute('href', target);
      // Best-effort auto-launch; the store/download page is the fallback.
      setTimeout(function () { location.href = target; }, 200);
    })();
  </script>
</body>
</html>
