<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#00C300" />
<title>Open in GaGa Chat</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<link rel="stylesheet" href="/assets/styles.css" />
<style>
  .open-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(60% 55% at 80% 5%, rgba(0,195,0,.12), transparent 60%), #fbfefb; }
  .open-box { background:#fff; border:1px solid var(--line); border-radius:22px; padding:38px 28px;
    max-width:420px; width:100%; text-align:center; box-shadow: var(--shadow); }
  .open-box img { width:84px; height:84px; border-radius:22px; margin:0 auto 18px; box-shadow: var(--shadow); }
  .open-box h1 { font-size:1.45rem; }
  .open-box p { margin-bottom:24px; }
  .open-box .btn { width:100%; justify-content:center; }
  .open-box .alt { display:block; margin-top:16px; font-size:.9rem; color:var(--green-700); font-weight:600; }
</style>
</head>
<body>
  <div class="open-wrap">
    <div class="open-box">
      <img src="/assets/logo-192.png" alt="GaGa Chat" />
      <h1>Open in GaGa Chat</h1>
      <p>This link opens inside the GaGa Chat app. If nothing happens, install the app to continue.</p>
      <a class="btn btn--primary" id="open" href="#">Open the app</a>
      <a class="alt" href="/download.html">Don't have GaGa Chat? Download it</a>
    </div>
  </div>
  <script>
    (function () {
      var path = location.pathname.replace(/^\//, '');
      var target = 'gagachat://' + path + location.search;
      document.getElementById('open').setAttribute('href', target);
      setTimeout(function () { location.href = target; }, 250);
    })();
  </script>
</body>
</html>
