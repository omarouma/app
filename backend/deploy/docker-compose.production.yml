services:
  api:
    image: ${GAGA_API_IMAGE:?Set GAGA_API_IMAGE to the immutable ACR image digest}
    restart: unless-stopped
    env_file:
      - /etc/gagachat/runtime.env
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - private

  proxy:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev
      - /var/run:size=4m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 256m
    cpus: 0.5
    networks:
      - private

networks:
  private:
    # Outbound TLS is required for Alibaba RDS/Redis/OSS and Firebase FCM.
    # No container port is publicly published from this network.
    driver: bridge
