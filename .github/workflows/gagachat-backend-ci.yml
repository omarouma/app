name: GaGaChat Alibaba backend source checks
on:
  push:
    branches: [gagachat-native-3.1.17]
    paths: [backend/**, .github/workflows/gagachat-backend-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Refresh supplied backend dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: gagachat-backend-refreshed-lock
          path: backend/package-lock.json
          if-no-files-found: error
      - run: npm ci
      - run: npm test
