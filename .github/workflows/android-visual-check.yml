name: GaGa native redesign visual checks
concurrency:
  group: android-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'android-native/core/ui/**'
      - 'android-native/feature/profile/**'
      - 'android-native/feature/wallet/**'
      - 'android-native/feature/settings/**'
      - 'android-native/feature/qr/**'
      - 'android-native/feature/people/**'
      - 'android-native/feature/calls/**'
      - 'android-native/feature/dailylife/**'
      - 'android-native/feature/chat/**'
      - 'android-native/feature/contacts/**'
      - 'android-native/core/data/**'
      - 'android-native/sync/workers/**'
      - '.github/workflows/android-visual-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure verified public backend
        run: python3 android-native/ci/prepare.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 360x800
            adb shell wm density 160
            bash android-native/ci/run_visual_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GaGa-native-redesign-visual-checks
          path: |
            visual-checks/
            android-native/feature/wallet/build/reports/androidTests/
            android-native/core/ui/build/reports/androidTests/
            android-native/feature/dailylife/build/reports/androidTests/
            android-native/feature/chat/build/reports/androidTests/
            android-native/feature/contacts/build/reports/androidTests/
            android-native/feature/calls/build/reports/androidTests/
            android-native/feature/qr/build/reports/androidTests/
            android-native/feature/profile/build/reports/androidTests/
          retention-days: 14
