name: Publish verified signed GaGa Android release
on:
  push:
    branches: [main]
    paths:
      - 'hosting/public/app-updates/android.json'
      - '.github/workflows/publish-signed-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Download release and validate hashes, app version and signing identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, urllib.request, pathlib, os, re, subprocess
          manifest = json.loads(pathlib.Path('hosting/public/app-updates/android.json').read_text())
          version = manifest['latestVersionName']
          code = manifest['latestVersionCode']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          assert isinstance(code, int) and code > 0
          expected = json.loads(pathlib.Path('android-native/ci/release-signing-public.json').read_text())['sha256']
          base = 'https://fcjgbbmfqdkucfpqjxae.supabase.co/storage/v1/object/public/gaga-app-releases/' + version + '/'
          out = pathlib.Path('signed-release'); out.mkdir()
          names = [f'GaGa-{version}-release.apk', f'GaGa-{version}-release.aab', 'SHA256SUMS.txt']
          for name in names:
              with urllib.request.urlopen(base + name, timeout=120) as response:
                  (out / name).write_bytes(response.read())
          hashes = dict((line.split()[1], line.split()[0]) for line in (out / 'SHA256SUMS.txt').read_text().splitlines())
          for name in names[:2]:
              assert hashlib.sha256((out / name).read_bytes()).hexdigest() == hashes[name]
          apk = out / names[0]
          assert hashes[names[0]] == manifest['channels']['apk']['sha256']
          assert apk.stat().st_size == manifest['channels']['apk']['sizeBytes']
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / '35.0.0'
          report = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          actual = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)', report).group(1)
          assert actual == expected
          (out / 'signature-verification.txt').write_text(report)
          bundle = out / names[1]
          bundle_report = subprocess.check_output(['jarsigner', '-verify', str(bundle)], text=True)
          assert 'jar verified.' in bundle_report
          bundle_cert = subprocess.check_output(['keytool', '-printcert', '-jarfile', str(bundle)], text=True)
          bundle_sha = re.search(r'SHA256: ([0-9A-F:]+)', bundle_cert).group(1).replace(':', '').lower()
          assert bundle_sha == expected
          badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "name='gagachat.app'" in badging and f"versionCode='{code}'" in badging and f"versionName='{version}'" in badging
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_VERSION=' + version + '\n')
          PY
      - name: Publish signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="android-${RELEASE_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite immutable signed assets.'
            exit 1
          fi
          git archive --format=zip --output="signed-release/GaGa-${RELEASE_VERSION}-complete-source.zip" HEAD
          gh release create "$tag" signed-release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GaGa ${RELEASE_VERSION}" --notes 'Signed APK/AAB with the approved new certificate. Older signing identities require one reinstall. Automated tests passed for the compiled source; real-device and Google Play account validation remain required.'
