name: Publish verified signed GaGa Android release
on:
  push:
    branches: [main]
    paths:
      - 'hosting/public/app-updates/android.json'
      - '.github/workflows/publish-signed-android.yml'
  workflow_dispatch:
concurrency:
  group: signed-android-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Verify public staged assets and approved signing identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, urllib.request, urllib.error, pathlib, os, re, subprocess
          manifest = json.loads(pathlib.Path('hosting/public/app-updates/android.json').read_text())
          version, code = manifest['latestVersionName'], manifest['latestVersionCode']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          assert isinstance(code, int) and code > 0
          pin = json.loads(pathlib.Path('android-native/ci/release-signing-public.json').read_text())['sha256']
          stage = 'https://fcjgbbmfqdkucfpqjxae.supabase.co/storage/v1/object/public/gaga-app-releases/' + version + '/'
          release = 'https://github.com/omarouma/app/releases/download/android-' + version + '/'
          bundle_release = 'https://github.com/omarouma/app/releases/download/bundle-' + version + '/'
          out = pathlib.Path('signed-release'); out.mkdir()
          def download(name):
              for base in (stage, bundle_release if name.endswith('.aab') else release):
                  try:
                      with urllib.request.urlopen(base + name, timeout=120) as response:
                          (out / name).write_bytes(response.read())
                      return out / name
                  except urllib.error.HTTPError as error:
                      if error.code not in (400, 404): raise
              raise RuntimeError('Verified public asset unavailable: ' + name)
          sums = download('SHA256SUMS.txt')
          hashes = dict((line.split()[1], line.split()[0]) for line in sums.read_text().splitlines())
          apk_name, bundle_name = f'GaGa-{version}-release.apk', f'GaGa-{version}-release.aab'
          apk = download(apk_name)
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == hashes[apk_name] == manifest['channels']['apk']['sha256']
          assert apk.stat().st_size == manifest['channels']['apk']['sizeBytes']
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / '35.0.0'
          report = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          assert re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)', report).group(1) == pin
          (out / 'signature-verification.txt').write_text(report)
          badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "name='gagachat.app'" in badging and f"versionCode='{code}'" in badging and f"versionName='{version}'" in badging
          bundle_config = manifest.get('artifacts', {}).get('aab')
          if bundle_config:
              assert bundle_config['url'] == bundle_release + bundle_name
              bundle = download(bundle_name)
              assert hashlib.sha256(bundle.read_bytes()).hexdigest() == hashes[bundle_name] == bundle_config['sha256']
              assert bundle.stat().st_size == bundle_config['sizeBytes']
              assert 'jar verified.' in subprocess.check_output(['jarsigner', '-verify', str(bundle)], text=True)
              cert = subprocess.check_output(['keytool', '-printcert', '-jarfile', str(bundle)], text=True)
              assert re.search(r'SHA256: ([0-9A-F:]+)', cert).group(1).replace(':', '').lower() == pin
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_VERSION=' + version + '\n')
          PY
      - name: Mirror immutable verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          version = os.environ['RELEASE_VERSION']; tag = 'android-' + version
          repository = os.environ['GITHUB_REPOSITORY']
          existing = subprocess.run(['gh','release','view',tag,'--repo',repository,'--json','assets'],capture_output=True,text=True)
          out = pathlib.Path('signed-release')
          if existing.returncode == 0:
              names = {item['name'] for item in json.loads(existing.stdout)['assets']}
              for path in sorted(out.iterdir()):
                  if path.suffix == '.aab': continue
                  if path.name in names:
                      with urllib.request.urlopen('https://github.com/' + repository + '/releases/download/' + tag + '/' + path.name,timeout=120) as response:
                          expected = hashlib.sha256(response.read()).hexdigest()
                      assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, 'Refusing to overwrite an existing different asset: ' + path.name
                  else:
                      subprocess.run(['gh','release','upload',tag,str(path),'--repo',repository],check=True)
          else:
              source = out / ('GaGa-' + version + '-complete-source.zip')
              subprocess.run(['git','archive','--format=zip','--output='+str(source),'HEAD'],check=True)
              notes = 'Signed GaGa Android release with the existing approved certificate. Includes the tested native source and verified public APK. Update installation requires user confirmation. Physical-device and Google Play internal-track qualification remain separate.'
              subprocess.run(['gh','release','create',tag,*[str(p) for p in sorted(out.iterdir()) if p.suffix != '.aab'],'--repo',repository,'--target',os.environ['GITHUB_SHA'],'--title','GaGa '+version,'--notes',notes],check=True)
          bundle = out / ('GaGa-' + version + '-release.aab')
          if bundle.is_file():
              bundle_tag = 'bundle-' + version
              previous = subprocess.run(['gh','release','view',bundle_tag,'--repo',repository,'--json','assets'],capture_output=True,text=True)
              if previous.returncode == 0:
                  names = {item['name'] for item in json.loads(previous.stdout)['assets']}
                  for path in (bundle, out / 'SHA256SUMS.txt'):
                      assert path.name in names, 'Existing companion release is incomplete'
                      with urllib.request.urlopen('https://github.com/' + repository + '/releases/download/' + bundle_tag + '/' + path.name,timeout=120) as response:
                          digest = hashlib.sha256(response.read()).hexdigest()
                      assert digest == hashlib.sha256(path.read_bytes()).hexdigest(), 'Companion asset mismatch'
              else:
                  notes = 'Signed GaGa ' + version + ' Android App Bundle companion. Matches the approved native release identity. APK and native source: https://github.com/' + repository + '/releases/tag/' + tag + '. Google Play upload and internal-track qualification remain separate.'
                  subprocess.run(['gh','release','create',bundle_tag,str(bundle),str(out / 'SHA256SUMS.txt'),'--repo',repository,'--target',os.environ['GITHUB_SHA'],'--title','GaGa '+version+' App Bundle','--latest=false','--notes',notes],check=True)

          PY
