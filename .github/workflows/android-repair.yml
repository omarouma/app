name: GaGa Android repair validation
concurrency:
  group: android-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, codex/gaga-livekit-call-repair]
    tags: ['android-*']
  pull_request:
    paths:
      - 'android-native/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'database.rules.json'
      - 'storage.rules'
      - '.github/workflows/android-repair.yml'
  workflow_dispatch:
    inputs:
      production_release:
        description: 'Require matching-key signed APK and AAB; block unsigned uploads'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test LiveKit token authorization
        run: node --test supabase/functions/livekit-token/tests/token.test.mjs supabase/functions/create-call/tests/admission.test.mjs
      - name: Test friend-event push authorization
        run: node --test supabase/functions/friend-event-push/tests/dispatch.test.mjs
      - name: Test FCM notification recipient protection
        run: node --test supabase/functions/send-fcm-push/tests/push.test.mjs
      - name: Test authenticated link-preview egress protection
        run: node --test supabase/functions/link-preview/tests/security.test.mjs
      - name: Test private view-once media input limits
        run: node --test supabase/functions/view-once-photo/tests/security.test.mjs
      - name: Test read-only chain providers
        run: node --test supabase/functions/chain-wallet/tests/chain.test.mjs
      - name: Read app version
        run: |
          python3 - <<'PYVERSION'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName = "([0-9.]+)"', Path('android-native/app/build.gradle.kts').read_text()).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('GAGA_VERSION=' + version + '\n')
          PYVERSION
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify production artifact gate regression tests
        run: python3 -m unittest discover -s android-native/ci -p 'test_verify_production_release.py' -v
      - name: Enforce Google Play update-install policy
        run: python3 -m unittest discover -s android-native/ci -p 'test_play_update_policy.py' -v
      - name: Validate Firebase public configuration
        run: |
          python3 - <<'PYFIREBASE'
          import json, pathlib, re, subprocess
          public = json.loads(pathlib.Path('android-native/ci/backend-public.json').read_text())
          firebase = public['firebase']
          gradle = pathlib.Path('android-native/app/build.gradle.kts').read_text()
          assert firebase['project_id'] == 'oumagachat'
          assert firebase['gcm_defaultSenderId'] == '545448312835'
          assert 'applicationId = "gagachat.app"' in gradle
          json.loads(pathlib.Path('database.rules.json').read_text())
          firebase_hosting = json.loads(pathlib.Path('firebase.json').read_text())['hosting']
          local_hosting = json.loads(pathlib.Path('hosting/firebase.json').read_text())['hosting']
          expected_hosting = dict(firebase_hosting, public='public')
          assert local_hosting == expected_hosting, 'Hosting root/subdirectory configs drifted: stale download target risk'
          json.loads(pathlib.Path('firestore.indexes.json').read_text())
          service_marker = '"type": ' + '"service_' + 'account"'
          private_marker = '-----BEGIN' + ' PRIVATE KEY-----'
          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          for name in tracked:
              if not name or name.endswith(('.md','.txt')):
                  continue
              path = pathlib.Path(name)
              try:
                  text = path.read_text(errors='ignore')
              except Exception:
                  continue
              # Detect an actual Google service-account JSON object, not comments
              # or documentation that merely names the credential type/PEM marker.
              if path.suffix.lower() == '.json':
                  try:
                      payload = json.loads(text)
                  except Exception:
                      payload = None
                  if isinstance(payload, dict):
                      assert payload.get('type') != 'service_account', f'service account credential committed in {name}'
                      assert not payload.get('private_key'), f'private key committed in {name}'
              # For non-JSON files only flag a PEM marker followed by key-like
              # base64 material; examples containing "..."/docs remain allowed.
              pem = re.search(re.escape(private_marker) + r'\\s*(?:\\\\n|\\n)?([A-Za-z0-9+/=]{80,})', text)
              assert pem is None, f'private key material committed in {name}'
          PYFIREBASE
      - name: Configure existing public backend
        run: python3 android-native/ci/prepare.py
      - name: Verify Firebase project, app, FCM and Crashlytics build identity
        run: python3 android-native/ci/verify_firebase_release_config.py
      - name: Check Firebase Android OAuth clients and Admin-key separation
        run: python3 -m unittest discover -s android-native/ci -p 'test_firebase_public_client_config.py' -v
      - name: Package complete verified source snapshot
        run: |
          mkdir -p deliverables
          git archive --format=zip --output=deliverables/GaGa-${GAGA_VERSION}-complete-source.zip HEAD
          git rev-parse HEAD > deliverables/SOURCE-COMMIT.txt
      - name: Package professional chat source files
        # Source can still be inspected if later Android compilation fails.
        run: |
          mkdir -p deliverables
          zip -q deliverables/GaGa-2.7.3-professional-chat-source.zip \
            android-native/feature/home/src/main/kotlin/app/gagachat/feature/home/presentation/HomeScreen.kt \
            android-native/feature/home/src/main/kotlin/app/gagachat/feature/home/presentation/HomeViewModel.kt \
            android-native/feature/home/src/main/kotlin/app/gagachat/feature/home/presentation/ConversationRow.kt \
            android-native/feature/chat/src/main/kotlin/app/gagachat/feature/chat/presentation/ChatScreen.kt \
            android-native/feature/chat/src/main/kotlin/app/gagachat/feature/chat/presentation/ChatUiPolicy.kt \
            android-native/feature/chat/src/main/kotlin/app/gagachat/feature/chat/presentation/components/MessageBubble.kt \
            android-native/feature/chat/src/main/kotlin/app/gagachat/feature/chat/presentation/components/MessageComposer.kt \
            android-native/feature/chat/src/test/kotlin/app/gagachat/feature/chat/presentation/ChatUiPolicyTest.kt \
            android-native/docs/PROFESSIONAL_CHAT_UI_2.7.3.md
      - name: Package QR and People source files
        run: |
          mkdir -p deliverables
          zip -q deliverables/GaGa-2.7.3-QR-People-improvements-source.zip \
            android-native/feature/qr/src/main/kotlin/app/gagachat/feature/qr/MyQrViewModel.kt \
            android-native/feature/qr/src/main/kotlin/app/gagachat/feature/qr/MyQrScreen.kt \
            android-native/feature/qr/src/main/kotlin/app/gagachat/feature/qr/AddByCodeViewModel.kt \
            android-native/feature/qr/src/main/kotlin/app/gagachat/feature/qr/AddByCodeScreen.kt \
            android-native/feature/qr/src/main/kotlin/app/gagachat/feature/qr/QrCameraScanner.kt \
            android-native/feature/qr/src/main/kotlin/app/gagachat/feature/qr/QrImageDecoder.kt \
            android-native/feature/qr/src/main/kotlin/app/gagachat/feature/qr/QrNavigation.kt \
            android-native/feature/qr/src/test/kotlin/app/gagachat/feature/qr/QrPayloadTest.kt \
            android-native/feature/qr/build.gradle.kts \
            android-native/feature/people/src/main/kotlin/app/gagachat/feature/people/PeopleScreen.kt \
            android-native/feature/people/src/main/kotlin/app/gagachat/feature/people/PeopleViewModel.kt \
            android-native/feature/people/src/main/kotlin/app/gagachat/feature/people/PeopleNavigation.kt \
            android-native/feature/people/src/main/kotlin/app/gagachat/feature/people/DiscoverScreen.kt \
            android-native/feature/people/src/main/kotlin/app/gagachat/feature/people/DiscoverViewModel.kt \
            android-native/app/src/main/kotlin/app/gagachat/navigation/MainNavHost.kt \
            android-native/docs/QR_PEOPLE_PROFESSIONAL_2.7.3.md
      - name: Package People synchronization sources
        run: |
          mkdir -p deliverables
          zip -q deliverables/GaGa-2.7.3-People-Sync-Notifications-source.zip \
            android-native/core/network/src/main/kotlin/app/gagachat/core/network/rest/SupabaseRestApi.kt \
            android-native/core/data/src/main/kotlin/app/gagachat/core/data/preferences/FavoritePeoplePreferences.kt \
            android-native/core/data/src/main/kotlin/app/gagachat/core/data/repository/FriendsRepository.kt \
            android-native/feature/people/src/main/kotlin/app/gagachat/feature/people/PeopleViewModel.kt \
            android-native/feature/people/src/main/kotlin/app/gagachat/feature/people/DiscoverScreen.kt \
            android-native/app/src/main/kotlin/app/gagachat/push/PushHandler.kt \
            android-native/app/src/main/kotlin/app/gagachat/push/NotificationHelper.kt \
            android-native/app/src/main/kotlin/app/gagachat/push/NotificationChannels.kt \
            supabase/migrations/20261015000000_favorite_friends_and_friend_events.sql \
            supabase/functions/friend-event-push/index.ts \
            supabase/functions/friend-event-push/tests/dispatch.test.mjs \
            supabase/functions/send-fcm-push/index.ts \
            android-native/docs/PEOPLE_SYNC_NOTIFICATIONS_2.7.3.md
      - name: Compile release and test messaging and call contracts
        working-directory: android-native
        run: gradle --no-daemon --no-build-cache --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8' -Pksp.incremental=false :feature:dailylife:compileReleaseKotlin :feature:dailylife:testReleaseUnitTest :feature:profile:testReleaseUnitTest :feature:settings:compileReleaseKotlin :app:assembleRelease :app:bundleRelease :app:testReleaseUnitTest :core:model:test :core:data:testReleaseUnitTest :core:network:testReleaseUnitTest :feature:chat:testReleaseUnitTest :feature:qr:testReleaseUnitTest :feature:calls:testReleaseUnitTest
      - name: Package release artifacts
        run: |
          mkdir -p deliverables
          cp android-native/app/build/outputs/apk/release/app-release-unsigned.apk deliverables/GaGa-${GAGA_VERSION}-release-unsigned.apk
          cp android-native/app/build/outputs/bundle/release/app-release.aab deliverables/GaGa-${GAGA_VERSION}-release-unsigned.aab
      - name: Build and validate size-limited direct-download APK
        run: |
          cd android-native
          gradle --no-daemon --no-build-cache --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8' -Pksp.incremental=false -PgagaCompactApk=true :app:assembleRelease
          cd ..
          cp android-native/app/build/outputs/apk/release/app-release-unsigned.apk deliverables/GaGa-${GAGA_VERSION}-compact-unsigned.apk
          python3 android-native/ci/verify_compact_apk.py --normal deliverables/GaGa-${GAGA_VERSION}-release-unsigned.apk --compact deliverables/GaGa-${GAGA_VERSION}-compact-unsigned.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Sign only with the matching release key
        env:
          KEYSTORE_BASE64: ${{ secrets.GAGA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GAGA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GAGA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GAGA_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Release signing key is unavailable; artifacts are explicitly unsigned.' > deliverables/SIGNING-REQUIRED.txt
            exit 0
          fi
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Signing secrets are incomplete; signed artifacts will not be produced.' > deliverables/SIGNING-REQUIRED.txt
            exit 0
          fi
          umask 077
          keyfile="$RUNNER_TEMP/gaga-release.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keyfile"
          actual=$(keytool -exportcert -keystore "$keyfile" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          # User-authorized release-key rotation on 2026-10-14. Preserve this
          # identity for every subsequent direct APK release.
          case "$actual" in
            dd6b6f166100e0db29a3f58af7439f5065c0148632d78ca5cd1d1a585a19af13)
              echo 'Signer matches GaGa 2.7.8. Older signing identities require reinstall; subsequent releases using this key support in-place updates.' > deliverables/UPDATE-COMPATIBILITY.txt ;;
            *)
              echo 'Configured keystore is NOT the approved GaGa 2.7.8 signing identity.' > deliverables/SIGNING-REQUIRED.txt
              exit 0 ;;
          esac
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out deliverables/GaGa-${GAGA_VERSION}-release.apk deliverables/GaGa-${GAGA_VERSION}-release-unsigned.apk
          cp deliverables/GaGa-${GAGA_VERSION}-release-unsigned.aab deliverables/GaGa-${GAGA_VERSION}-release.aab
          jarsigner -keystore "$keyfile" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD deliverables/GaGa-${GAGA_VERSION}-release.aab "$KEY_ALIAS"
          "$signer" verify --verbose --print-certs deliverables/GaGa-${GAGA_VERSION}-release.apk > deliverables/signature-verification.txt
      - name: Checksums
        run: cd deliverables && sha256sum *.apk *.aab > SHA256SUMS.txt
      - name: Production release gate (never upload an unsigned build as Play-ready)
        if: always()
        env:
          GAGA_PRODUCTION_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_release) || startsWith(github.ref, 'refs/tags/android-') }}
        run: |
          if [ -f deliverables/GaGa-${GAGA_VERSION}-release-unsigned.apk ] && [ -f deliverables/GaGa-${GAGA_VERSION}-release-unsigned.aab ]; then
            if [ "$GAGA_PRODUCTION_RELEASE" = 'true' ]; then
              python3 android-native/ci/verify_production_release.py --artifacts deliverables --version "$GAGA_VERSION" --strict
            else
              python3 android-native/ci/verify_production_release.py --artifacts deliverables --version "$GAGA_VERSION"
            fi
          else
            mkdir -p deliverables
            echo 'BUILD FAILED: signed/unsigned Android artifacts were not generated.' > deliverables/PRODUCTION-READINESS.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GaGa-${{ env.GAGA_VERSION }}-release-and-tests
          path: |
            deliverables/
            android-native/core/model/build/reports/tests/test/
            android-native/feature/qr/build/reports/tests/testReleaseUnitTest/
            android-native/feature/qr/build/test-results/testReleaseUnitTest/
            android-native/feature/chat/build/reports/tests/testReleaseUnitTest/
            android-native/feature/chat/build/test-results/testReleaseUnitTest/
            android-native/feature/calls/build/reports/tests/testReleaseUnitTest/
            android-native/feature/calls/build/test-results/testReleaseUnitTest/
            android-native/core/network/build/reports/tests/testReleaseUnitTest/
            android-native/core/network/build/test-results/testReleaseUnitTest/
            android-native/core/data/build/reports/tests/testReleaseUnitTest/
            android-native/core/data/build/test-results/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 14
