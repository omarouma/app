name: GaGa Trusted Chat Mirror Contract

on:
  pull_request:
    paths:
      - 'supabase/functions/trusted-chat-mirror/**'
      - '.github/workflows/trusted-chat-mirror-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaga-trusted-mirror-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provisioner-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run trusted projection security, membership, deletion and CAS tests
        run: node --test supabase/functions/trusted-chat-mirror/tests/provisioner.test.mjs
