name: GaGaChat Android
on:
  push:
    branches: [gagachat-native-3.1.17]
    paths: [android/**, .github/workflows/android-build.yml]
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build signed production APK and AAB (requires signing secrets)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reject committed signing material
        run: |
          if find . -type f \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -name 'keystore.properties' \) -print -quit | grep -q .; then
            echo 'Signing material must be supplied only through GitHub Actions secrets.' >&2
            exit 1
          fi
      - run: node --test test/*.cjs
      - run: ./gradlew --no-daemon clean lintQa assembleQa
      - run: ./gradlew --no-daemon bundleQa
      - run: bash ci/verify-apk-backends.sh app/build/outputs/apk/qa/app-universal-qa.apk
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gagachat-3.1.17-qa-lint
          path: android/app/build/reports/lint-results-qa.html
          if-no-files-found: ignore
      - run: bash ci/collect-artifacts.sh qa
      - name: Verify QA bundle metadata
        run: |
          test -f app/build/outputs/bundle/qa/app-qa.aab
          unzip -t app/build/outputs/bundle/qa/app-qa.aab >/dev/null
          cp app/build/outputs/bundle/qa/app-qa.aab dist/qa/GaGaChat-v3.1.17-qa.aab
          (cd dist/qa && sha256sum *apk *aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: gagachat-3.1.17-qa
          path: android/dist/qa/
          if-no-files-found: error
  emulator_smoke:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: gagachat-3.1.17-qa
          path: qa-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise QA APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/ci/emulator-smoke.sh qa-artifacts/app-universal-qa.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gagachat-device-smoke-api-${{ matrix.api }}
          path: android/device-smoke/
          if-no-files-found: warn
  signed_release:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release
    needs: [qa, emulator_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    env:
      GAGA_SIGNING_STORE_PASSWORD: ${{ secrets.GAGA_SIGNING_STORE_PASSWORD }}
      GAGA_SIGNING_KEY_ALIAS: ${{ secrets.GAGA_SIGNING_KEY_ALIAS }}
      GAGA_SIGNING_KEY_PASSWORD: ${{ secrets.GAGA_SIGNING_KEY_PASSWORD }}
      GAGA_REQUIRE_RELEASE_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Require reachable production Alibaba API
        run: bash ci/verify-backend.sh backend-verification.txt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gagachat-release-backend-verification
          path: android/backend-verification.txt
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload key outside repository
        env:
          GAGA_SIGNING_STORE_BASE64: ${{ secrets.GAGA_SIGNING_STORE_BASE64 }}
        run: |
          test -n "$GAGA_SIGNING_STORE_BASE64"
          test -n "$GAGA_SIGNING_STORE_PASSWORD"
          test -n "$GAGA_SIGNING_KEY_ALIAS"
          test -n "$GAGA_SIGNING_KEY_PASSWORD"
          umask 077
          printf '%s' "$GAGA_SIGNING_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/gagachat-upload.jks"
          echo "GAGA_SIGNING_STORE_FILE=$RUNNER_TEMP/gagachat-upload.jks" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon clean lintRelease assembleRelease
      - run: ./gradlew --no-daemon bundleRelease
      - run: bash ci/collect-artifacts.sh release
      - name: Check AAB and checksum
        run: |
          unzip -t dist/release/GaGaChat-v3.1.17-release.aab >/dev/null
          (cd dist/release && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: gagachat-3.1.17-signed-release
          path: android/dist/release/
          if-no-files-found: error
      - if: always()
        run: rm -f "$RUNNER_TEMP/gagachat-upload.jks"
