name: Build approved signed GaGa candidate

# Deliberately manual: never auto-publish an untested APK or alter the live update manifest.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore approved keystore and verify certificate before building
        env:
          GAGA_RELEASE_KEYSTORE_BASE64: ${{ secrets.GAGA_RELEASE_KEYSTORE_BASE64 }}
          GAGA_RELEASE_STORE_PASSWORD: ${{ secrets.GAGA_RELEASE_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GAGA_RELEASE_KEYSTORE_BASE64}" ] || [ -z "${GAGA_RELEASE_STORE_PASSWORD}" ]; then
            echo "::error::Approved release-key secrets are not configured. No signing was attempted."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/gaga-signing"
          keyfile="$RUNNER_TEMP/gaga-signing/release.jks"
          printf '%s' "$GAGA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          actual="$(keytool -list -v -keystore "$keyfile" -alias gaga             -storepass:env GAGA_RELEASE_STORE_PASSWORD             | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          expected="$(python3 -c 'import json; print(json.load(open("android-native/ci/release-signing-public.json"))["sha256"])')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Keystore identity does not match the pinned GaGa release certificate. Aborting."
            exit 1
          fi
          echo "GAGA_RELEASE_STORE_FILE=$keyfile" >> "$GITHUB_ENV"
          echo "GAGA_RELEASE_KEY_ALIAS=gaga" >> "$GITHUB_ENV"
          echo "Release certificate fingerprint verified against the repository pin."

      - name: Configure verified public Firebase and Supabase identifiers
        run: python3 android-native/ci/prepare.py

      - name: Compile APK and AAB signed with the approved key
        env:
          GAGA_RELEASE_STORE_PASSWORD: ${{ secrets.GAGA_RELEASE_STORE_PASSWORD }}
          GAGA_RELEASE_KEY_PASSWORD: ${{ secrets.GAGA_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GAGA_RELEASE_KEY_PASSWORD" || { echo "::error::Missing signing key password"; exit 1; }
          gradle -p android-native --no-daemon --max-workers=2 \
            :app:assembleRelease :app:bundleRelease

      - name: Verify BOTH signatures, package identity, version and hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          root=pathlib.Path("android-native")
          out=pathlib.Path("signed-candidate")
          out.mkdir(exist_ok=True)
          gradle=(root/"app/build.gradle.kts").read_text()
          version=re.search(r'versionName\s*=\s*"([0-9.]+)"', gradle).group(1)
          code=re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1)
          apk=root/"app/build/outputs/apk/release/app-release.apk"
          aab=root/"app/build/outputs/bundle/release/app-release.aab"
          assert apk.is_file() and aab.is_file(), "Signed outputs missing"
          tools=pathlib.Path(os.environ["ANDROID_HOME"])/"build-tools"/"35.0.0"
          expected=json.loads((root/"ci/release-signing-public.json").read_text())["sha256"]
          rep=subprocess.check_output([str(tools/"apksigner"),"verify","--verbose","--print-certs",str(apk)],text=True)
          match=re.search(r"Signer #1 certificate SHA-256 digest: ([0-9a-f]+)",rep)
          assert match and match.group(1)==expected, "APK certificate mismatch"
          cert=subprocess.check_output(["keytool","-printcert","-jarfile",str(aab)],text=True)
          match=re.search(r"SHA256: ([0-9A-F:]+)",cert)
          assert match and match.group(1).replace(":","").lower()==expected, "AAB certificate mismatch"
          subprocess.run(["jarsigner","-verify",str(aab)],check=True,stdout=subprocess.DEVNULL)
          info=subprocess.check_output([str(tools/"aapt"),"dump","badging",str(apk)],text=True)
          assert "name='gagachat.app'" in info and f"versionCode='{code}'" in info and f"versionName='{version}'" in info, "App identity mismatch"
          outputs=[]
          for src in (apk,aab):
              name=f"GaGa-{version}-release.{src.suffix.lstrip('.')}"
              dst=out/name
              shutil.copyfile(src,dst)
              outputs.append((hashlib.sha256(dst.read_bytes()).hexdigest(),name))
          (out/"SHA256SUMS.txt").write_text("".join(f"{digest}  {name}\n" for digest,name in outputs))
          (out/"signature-verification.txt").write_text(
              "APK and AAB SHA-256 signing certificate validated against pinned identity.\n"
              f"package=gagachat.app\nversionCode={code}\nversionName={version}\n"
              f"certificate_sha256={expected}\n"
              "Not Play Console-approved or real-device tested. Manual release approval required.\n")
          print(f"Verified signed candidate GaGa {version} ({code})")
          PY

      - name: Package exact source snapshot
        shell: bash
        run: |
          git archive --format=zip             --output="signed-candidate/GaGa-$(sed -n 's/.*versionName = "\([0-9.]*\)".*/\1/p' android-native/app/build.gradle.kts | head -1)-complete-source.zip"             HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: GaGa-verified-signed-candidate
          path: signed-candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Remove keystore from runner
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/gaga-signing" ]; then
            rm -rf "$RUNNER_TEMP/gaga-signing"
          fi
