name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy (Hosting)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Run tests
        run: npm test

      - name: Verify calling gateway syntax
        run: npm run check:calling

      - name: Build production bundle
        # Public browser configuration is committed in .env.production (no server
        # secrets). Do not inject empty secret values here: an unset GitHub
        # secret expands to an empty string and would override the committed
        # values, tripping the vite env-guard.
        run: npm run build

      - name: Deploy Hosting to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: oumagachat
          firebaseToolsVersion: latest
