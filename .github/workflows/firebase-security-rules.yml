name: GaGa Firebase Rules Emulator

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase/tests/**'
      - 'firebase/package.json'
      - 'firebase.json'
      - '.github/workflows/firebase-security-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaga-firebase-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firestore-rules:
    name: Firestore authorization allow/deny tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: npm install --prefix firebase --ignore-scripts --no-audit --no-fund
      - name: Run Firestore Rules Emulator (demo project only)
        env:
          CI: 'true'
          FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
        run: |
          firebase/node_modules/.bin/firebase emulators:exec \
            --project demo-gaga-security-tests \
            --only firestore \
            --config firebase.json \
            "node --test firebase/tests/firestore.rules.emulator.test.mjs"
