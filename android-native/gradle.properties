# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=2048m -XX:ReservedCodeCacheSize=192m -Dfile.encoding=UTF-8 -XX:+UseSerialGC
# Cap the Kotlin compile daemon: on this ~3.9GB box it runs alongside the Gradle
# daemon, so both must fit in RAM or the OS OOM-killer kills the build.
kotlin.daemon.jvmargs=-Xmx448m -XX:MaxMetaspaceSize=448m -XX:ReservedCodeCacheSize=96m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
# Run the Kotlin compiler inside the Gradle daemon instead of spawning a
# separate KotlinCompileDaemon. Critical on this ~3.8GB sandbox: a second JVM
# would push the box into the OOM killer.
kotlin.compiler.execution.strategy=in-process

# R8 / minification (PDF §9.1 — enable in release).
# Full mode is disabled for compatibility with reflection-heavy libraries
# (Hilt/Ktor/kotlinx-serialization) in this constrained build environment.
android.enableR8.fullMode=false

# Limit R8 to a single worker to stay within the constrained memory/CPU budget.
android.r8.maxWorkers=1

# Non-final resource IDs for faster incremental builds
android.nonFinalResIds=true

# ---------------------------------------------------------------------------
# Release decisions (docs/RELEASE_DECISIONS.md) — Firebase migration switches.
#
# The Firebase-first login/chat cutover is NOT deployable yet: the
# `firebase-identity` and `media-auth` Supabase Edge Functions (HTTP 404) and the
# `firebase_identity` table (PGRST205) are not present on the live project, so
# enabling FIREBASE_AUTH_FIRST would break real registration/login.
#
# Keep both OFF: the proven Supabase backend stays authoritative. Override with
# -PFIREBASE_TRANSPORT_ENABLED=true -PFIREBASE_AUTH_FIRST=true only after the
# runbook in docs/FIREBASE_MIGRATION_RUNBOOK.md has been completed.
# ---------------------------------------------------------------------------
FIREBASE_TRANSPORT_ENABLED=false
FIREBASE_AUTH_FIRST=false
