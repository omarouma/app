# Project-wide Gradle settings.
# NOTE (build sandbox): this box has ~3.8GB RAM. The Gradle daemon's metaspace
# cap is deliberately bounded so the daemon's total RSS cannot grow past the
# point where the OS OOM-killer terminates it mid-build (observed at 2.8GB RSS
# with a 2048m metaspace cap). Heap is kept large enough for in-process Kotlin.
org.gradle.jvmargs=-Xmx1408m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8 -XX:+UseSerialGC
# Cap the Kotlin compile daemon: on this ~3.8GB box it runs alongside the Gradle
# daemon, so both must fit in RAM or the OS OOM-killer kills the build.
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
# Run the Kotlin compiler inside the Gradle daemon instead of spawning a
# separate KotlinCompileDaemon. Critical on this ~3.8GB sandbox: a second JVM
# would push the box into the OOM killer.
kotlin.compiler.execution.strategy=in-process

# R8 / minification (PDF §9.1 — enable in release).
# Full mode is disabled for compatibility with reflection-heavy libraries
# (Hilt/Ktor/kotlinx-serialization) in this constrained build environment.
android.enableR8.fullMode=false

# Limit R8 to a single worker to stay within the constrained memory/CPU budget.
android.r8.maxWorkers=1

# Non-final resource IDs for faster incremental builds
android.nonFinalResIds=true
