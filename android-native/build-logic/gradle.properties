# Keep the build-logic (convention plugin) Kotlin compilation inside the Gradle
# daemon and bound its memory, so the included build does not spawn a second,
# long-lived Kotlin daemon that competes for RAM on this constrained box.
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m
