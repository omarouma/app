<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Performance: early connection hint for the primary backend origin. -->
  <link rel="preconnect" href="https://fcjgbbmfqdkucfpqjxae.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://fcjgbbmfqdkucfpqjxae.supabase.co" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="orientation" content="portrait" />
  <meta name="screen-orientation" content="portrait" />
  <meta name="x5-orientation" content="portrait" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="x5-page-mode" content="app" />
  <meta name="apple-mobile-web-app-orientation" content="portrait" />
  <meta name="theme-color" content="#00C300" />
  <meta name="background-color" content="#ffffff" />
  <meta name="application-name" content="GaGa Chat" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon-32x32.png" />
  <link rel="preload" as="image" type="image/svg+xml" href="/logo.svg" />

  <script>
    (function () {
      try {
        var lang = localStorage.getItem("gaga_language") || "en";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      } catch (e) { }
    })();
  </script>
  <title>GaGa Chat</title>
</head>

<body>
  <div id="root"></div>
  <noscript>
    <div style="text-align: center; padding: 40px; font-family: sans-serif">
      <h1 style="color: #00c300">GaGa Chat</h1>
      <p>Please enable JavaScript to use GaGa Chat.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
