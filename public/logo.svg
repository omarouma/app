<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="GaGa Chat">
  <defs>
    <linearGradient id="gagaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8CF56B"/>
      <stop offset="45%" stop-color="#5FD83F"/>
      <stop offset="100%" stop-color="#2B992D"/>
    </linearGradient>
    <linearGradient id="gagaText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3FB82A"/>
      <stop offset="100%" stop-color="#1E7A22"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square brand background -->
  <rect x="0" y="0" width="512" height="512" rx="118" ry="118" fill="url(#gagaBg)"/>

  <!-- Soft top-left highlight -->
  <ellipse cx="150" cy="90" rx="240" ry="150" fill="#ffffff" opacity="0.12"/>

  <!-- White circular chat bubble with a small tail -->
  <path
    d="M256 96
       C 168 96 96 162 96 244
       C 96 326 168 388 256 388
       C 344 388 416 326 416 244
       C 416 162 344 96 256 96
       Z"
    fill="#ffffff"/>
  <path
    d="M232 372
       L 256 412
       L 280 372
       Z"
    fill="#ffffff"/>

  <!-- "GaGa" wordmark in brand green -->
  <text x="256" y="272"
        text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="132"
        font-weight="800"
        letter-spacing="-4"
        fill="url(#gagaText)">GaGa</text>
</svg>
