<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - GaGa Chat</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .circle {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #F5F5F5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .circle span {
      font-size: 28px;
      font-weight: 700;
      color: #00C300;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #8D8D8D;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-back {
      background: transparent;
      border: 1px solid #EBEBEB;
      color: #111111;
    }
    .btn-back:hover { background: #F5F5F5; }
    .btn-home {
      background: #00C300;
      color: #fff;
      font-weight: 700;
    }
    .btn-home:hover { background: #00A300; }
  </style>
</head>
<body>
  <div class="container">
    <div class="circle">
      <span>404</span>
    </div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <div class="buttons">
      <button class="btn btn-back" onclick="history.back()">&#8592; Go Back</button>
      <a href="/" class="btn btn-home">&#8962; Home</a>
    </div>
  </div>
</body>
</html>
